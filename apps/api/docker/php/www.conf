; ============================================================
; PHP-FPM pool configuration
; ============================================================
[www]
user = www-data
group = www-data

; Listen on TCP (nginx communicates via 127.0.0.1:9000)
listen = 127.0.0.1:9000

; Process manager – dynamic for balanced memory vs throughput
pm = dynamic
pm.max_children = 20
pm.start_servers = 5
pm.min_spare_servers = 3
pm.max_spare_servers = 10
pm.max_requests = 500

; Timeouts
request_terminate_timeout = 300

; Log slow requests (> 5 s)
slowlog = /dev/stderr
request_slowlog_timeout = 5

; Clear environment for security
clear_env = no

; Pass all env vars to PHP workers
env[APP_ENV] = $APP_ENV
env[APP_KEY] = $APP_KEY
env[APP_DEBUG] = $APP_DEBUG
