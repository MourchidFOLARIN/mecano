server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php index.html;

    # Security headers (extra layer at nginx level)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # Hide server tokens
    server_tokens off;

    # Max upload size (media files)
    client_max_body_size 64M;

    # Health-check endpoint for Docker / load-balancers
    location = /up {
        try_files $uri /index.php?$query_string;
    }

    # Main Laravel dispatcher
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM handler
    location ~ \.php$ {
        fastcgi_pass   127.0.0.1:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include        fastcgi_params;

        fastcgi_hide_header X-Powered-By;

        # Timeouts for longer API calls (media processing)
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
    }

    # Block access to dot-files
    location ~ /\. {
        deny all;
    }

    # Block direct access to PHP files in storage/
    location ~* ^/storage/.*\.php$ {
        deny all;
    }

    # Static asset caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Gzip compression
    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;
    gzip_comp_level 5;
}
