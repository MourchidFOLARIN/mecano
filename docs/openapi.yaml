openapi: 3.0.3
info:
  title: "API Mékano"
  description: |
    Documentation et contrat d'interface officiel pour l'API REST de la plateforme **Mékano** (Vente de véhicules d'occasion, atelier de réparation mécanique, blog technique et médias IA).
    
    ### Authentification
    L'API utilise **Laravel Sanctum**. Pour accéder aux endpoints `/admin/*` :
    1. Envoyez vos identifiants à `POST /api/v1/auth/login`.
    2. Récupérez le `token` dans la réponse.
    3. Ajoutez le header `Authorization: Bearer <votre_token>` dans toutes vos requêtes suivantes.
  version: "1.0.0"
  contact:
    name: "Équipe Technique Mékano"
    email: "contact@garage.com"

servers:
  - url: "http://localhost:8000/api/v1"
    description: "Serveur de développement local"
  - url: "https://mecano-api.duckdns.org/api/v1"
    description: "Serveur de production / recette"

tags:
  - name: "Système & Santé"
    description: "Endpoints de vérification technique"
  - name: "Authentification"
    description: "Gestion des sessions et tokens Sanctum"
  - name: "Catalogue Public (Véhicules & Marques)"
    description: "Consultation des annonces et mesure d'audience"
  - name: "Atelier Public (Prestations)"
    description: "Forfaits et services de réparation mécanique"
  - name: "Blog Technique Public"
    description: "Articles et conseils d'entretien"
  - name: "Réglages Publics"
    description: "Coordonnées et horaires de l'établissement"
  - name: "Admin — Tableau de bord"
    description: "Métriques décisionnelles et taux de conversion"
  - name: "Admin — Véhicules & Marques"
    description: "Gestion du stock et machine à états"
  - name: "Admin — Médias & Traitement IA"
    description: "Upload direct Cloudinary, recadrage et détourage"
  - name: "Admin — Prestations Atelier"
    description: "Administration des forfaits"
  - name: "Admin — Blog"
    description: "Rédaction et publication d'articles"
  - name: "Admin — Réglages"
    description: "Configuration du garage"

paths:
  # ===========================================================================
  # 1. SYSTÈME & SANTÉ
  # ===========================================================================
  /health:
    get:
      summary: "État de santé du système"
      description: "Vérifie la connectivité à PostgreSQL (Supabase), au cache et aux services critiques."
      operationId: "getHealth"
      tags: ["Système & Santé"]
      responses:
        '200':
          description: "Système opérationnel"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
                  timestamp:
                    type: string
                    format: date-time
                    example: "2026-08-30T03:30:00Z"
                  database:
                    type: string
                    example: "connected"
                required:
                  - status
                  - timestamp

  # ===========================================================================
  # 2. AUTHENTIFICATION
  # ===========================================================================
  /auth/login:
    post:
      summary: "Connexion utilisateur (Admin / Mécanicien)"
      description: "Authentifie un utilisateur et génère un token d'accès Sanctum."
      operationId: "login"
      tags: ["Authentification"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  example: "mecanicien@garage.com"
                password:
                  type: string
                  format: password
                  example: "secret123"
              required:
                - email
                - password
      responses:
        '200':
          description: "Connexion réussie"
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: "1|7x3kLmQ..."
                  user:
                    $ref: "#/components/schemas/User"
                required:
                  - token
                  - user
        '401':
          $ref: "#/components/responses/Error401"
        '422':
          $ref: "#/components/responses/Error422"

  /auth/logout:
    post:
      summary: "Déconnexion utilisateur"
      description: "Révoque le jeton d'accès courant."
      operationId: "logout"
      tags: ["Authentification"]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: "Déconnexion réussie (sans contenu)"
        '401':
          $ref: "#/components/responses/Error401"

  /auth/me:
    get:
      summary: "Profil de l'utilisateur connecté"
      description: "Renvoie les informations de l'administrateur courant."
      operationId: "getMe"
      tags: ["Authentification"]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: "Profil utilisateur"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/User"
                required:
                  - data
        '401':
          $ref: "#/components/responses/Error401"

  # ===========================================================================
  # 3. CATALOGUE PUBLIC (VÉHICULES & MARQUES)
  # ===========================================================================
  /brands:
    get:
      summary: "Référentiel des marques actives"
      description: "Liste toutes les marques ayant des véhicules au catalogue pour alimenter les filtres."
      operationId: "getPublicBrands"
      tags: ["Catalogue Public (Véhicules & Marques)"]
      responses:
        '200':
          description: "Liste des marques"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Brand"

  /cars:
    get:
      summary: "Catalogue public des annonces"
      description: "Liste paginée des véhicules disponibles à la vente avec filtres multicritères."
      operationId: "getPublicCars"
      tags: ["Catalogue Public (Véhicules & Marques)"]
      parameters:
        - in: query
          name: marque
          schema:
            type: string
          description: "Slug de la marque (exemple: toyota)"
        - in: query
          name: prix_min
          schema:
            type: integer
          example: 3000000
        - in: query
          name: prix_max
          schema:
            type: integer
          example: 15000000
        - in: query
          name: carburant
          schema:
            type: string
            enum: [essence, diesel, hybride, electrique, gpl]
        - in: query
          name: transmission
          schema:
            type: string
            enum: [automatique, manuelle]
        - in: query
          name: inclure_vendus
          schema:
            type: boolean
            default: false
          description: "Inclure les véhicules déjà vendus"
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: per_page
          schema:
            type: integer
            default: 12
      responses:
        '200':
          description: "Catalogue de véhicules"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CarListItem"
                  links:
                    $ref: "#/components/schemas/PaginationLinks"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"

  /cars/{slug}:
    get:
      summary: "Fiche détaillée d'une annonce"
      description: "Retourne l'annonce complète avec sa galerie photo haute définition et ses vidéos intérieures/extérieures."
      operationId: "getPublicCarDetail"
      tags: ["Catalogue Public (Véhicules & Marques)"]
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
          example: "toyota-rav4-2021-1"
      responses:
        '200':
          description: "Détail du véhicule"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/CarDetail"
        '404':
          $ref: "#/components/responses/Error404"

  /cars/{slug}/events:
    post:
      summary: "Enregistrement d'un événement d'audience (Vue ou Clic WhatsApp)"
      description: "Enregistre de façon anonymisée (hachage salé SHA-256) l'intérêt d'un visiteur pour alimenter le tableau de bord."
      operationId: "recordCarEvent"
      tags: ["Catalogue Public (Véhicules & Marques)"]
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
          example: "toyota-rav4-2021-1"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum: [view, whatsapp_click]
                  example: "whatsapp_click"
                referer:
                  type: string
                  nullable: true
                  example: "https://google.com"
              required:
                - type
      responses:
        '204':
          description: "Événement enregistré"
        '404':
          $ref: "#/components/responses/Error404"

  # ===========================================================================
  # 4. ATELIER PUBLIC (PRESTATIONS)
  # ===========================================================================
  /services:
    get:
      summary: "Liste des prestations atelier"
      description: "Retourne les forfaits et services actifs de l'atelier ordonnancés par position."
      operationId: "getPublicServices"
      tags: ["Atelier Public (Prestations)"]
      responses:
        '200':
          description: "Liste des prestations"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Service"

  # ===========================================================================
  # 5. BLOG TECHNIQUE PUBLIC
  # ===========================================================================
  /posts:
    get:
      summary: "Liste des articles de blog"
      description: "Liste paginée des articles techniques publiés."
      operationId: "getPublicPosts"
      tags: ["Blog Technique Public"]
      parameters:
        - in: query
          name: service
          schema:
            type: string
          description: "Filtrer par slug de prestation atelier rattachée"
        - in: query
          name: page
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: "Liste des articles"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PostListItem"
                  links:
                    $ref: "#/components/schemas/PaginationLinks"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"

  /posts/{slug}:
    get:
      summary: "Lecture d'un article de blog"
      description: "Contenu complet de l'article au format texte brut structuré (sans HTML injectable)."
      operationId: "getPublicPostDetail"
      tags: ["Blog Technique Public"]
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
          example: "5-signes-usure-plaquettes-frein"
      responses:
        '200':
          description: "Article de blog"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PostDetail"
        '404':
          $ref: "#/components/responses/Error404"

  # ===========================================================================
  # 6. RÉGLAGES PUBLICS
  # ===========================================================================
  /settings:
    get:
      summary: "Coordonnées et horaires du garage"
      description: "Informations publiques de l'établissement (numéro WhatsApp, adresse, nom commercial)."
      operationId: "getPublicSettings"
      tags: ["Réglages Publics"]
      responses:
        '200':
          description: "Réglages du garage"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    example:
                      garage_name: "Garage Mékano Yaoundé"
                      whatsapp_number: "+237699000000"
                      address: "Quartier Bastos, Yaoundé"
                      opening_hours: "Lun - Sam : 08h00 - 18h00"

  # ===========================================================================
  # 7. ADMIN — TABLEAU DE BORD DÉCISIONNEL
  # ===========================================================================
  /admin/dashboard:
    get:
      summary: "Métriques et indicateurs clés de performance"
      description: "Retourne l'ensemble des indicateurs (vues, clics WhatsApp, taux de conversion, délai moyen de vente, top annonces et quotas IA)."
      operationId: "getAdminDashboard"
      tags: ["Admin — Tableau de bord"]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: "Tableau de bord complet"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/DashboardMetrics"
        '401':
          $ref: "#/components/responses/Error401"

  # ===========================================================================
  # 8. ADMIN — MARQUES & ANNONCES
  # ===========================================================================
  /admin/brands:
    get:
      summary: "Liste complète des marques"
      operationId: "getAdminBrands"
      tags: ["Admin — Véhicules & Marques"]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: "Liste des marques"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminBrand"
    post:
      summary: "Ajout d'une marque au référentiel"
      operationId: "createBrand"
      tags: ["Admin — Véhicules & Marques"]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "Toyota"
                logo_url:
                  type: string
                  nullable: true
              required:
                - name
      responses:
        '201':
          description: "Marque créée"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AdminBrand"
        '422':
          $ref: "#/components/responses/Error422"

  /admin/cars:
    get:
      summary: "Liste des annonces pour le backoffice"
      description: "Inclut tous les états (brouillons, disponibles, réservés, vendus)."
      operationId: "getAdminCars"
      tags: ["Admin — Véhicules & Marques"]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [draft, available, reserved, sold]
      responses:
        '200':
          description: "Liste des véhicules"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminCarDetail"
                  links:
                    $ref: "#/components/schemas/PaginationLinks"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
    post:
      summary: "Création d'une annonce (créée à l'état brouillon)"
      operationId: "createCar"
      tags: ["Admin — Véhicules & Marques"]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCarRequest"
      responses:
        '201':
          description: "Annonce créée"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AdminCarDetail"
        '422':
          $ref: "#/components/responses/Error422"

  /admin/cars/{id}:
    get:
      summary: "Consultation d'une annonce pour modification"
      operationId: "getAdminCar"
      tags: ["Admin — Véhicules & Marques"]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: "Fiche annonce complète"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AdminCarDetail"
        '404':
          $ref: "#/components/responses/Error404"
    patch:
      summary: "Mise à jour des informations d'une annonce"
      operationId: "updateCar"
      tags: ["Admin — Véhicules & Marques"]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCarRequest"
      responses:
        '200':
          description: "Annonce mise à jour"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AdminCarDetail"
        '422':
          $ref: "#/components/responses/Error422"
    delete:
      summary: "Suppression logique d'une annonce (Soft Delete)"
      operationId: "deleteCar"
      tags: ["Admin — Véhicules & Marques"]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: "Annonce supprimée"
        '404':
          $ref: "#/components/responses/Error404"

  /admin/cars/{id}/status:
    patch:
      summary: "Changement d'état métier d'une annonce"
      description: "Gère les transitions valides (ex: draft vers available requiert au moins 1 photo principale)."
      operationId: "changeCarStatus"
      tags: ["Admin — Véhicules & Marques"]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [available, reserved, sold]
              required:
                - status
      responses:
        '200':
          description: "Statut modifié"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AdminCarDetail"
        '422':
          $ref: "#/components/responses/Error422"

  # ===========================================================================
  # 9. ADMIN — MÉDIAS & TRAITEMENT IA
  # ===========================================================================
  /admin/media/upload-signature:
    post:
      summary: "Génération de signature d'upload direct"
      description: "Émet les paramètres signés sécurisés pour uploader directement vers Cloudinary (photos et vidéos)."
      operationId: "getUploadSignature"
      tags: ["Admin — Médias & Traitement IA"]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                car_id:
                  type: integer
                  example: 1
                kind:
                  type: string
                  enum: [photo, video]
                mime:
                  type: string
                  example: "image/jpeg"
                bytes:
                  type: integer
                  example: 2500000
              required:
                - car_id
                - kind
                - mime
                - bytes
      responses:
        '200':
          description: "Paramètres signés"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/SignedUpload"

  /admin/cars/{id}/media:
    get:
      summary: "Galerie des médias d'une annonce"
      operationId: "getCarMedia"
      tags: ["Admin — Médias & Traitement IA"]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: "Liste ordonnée des médias"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminMedia"
    post:
      summary: "Confirmation d'un média uploadé"
      description: "Enregistre le média en base après upload réussi sur le CDN."
      operationId: "confirmMediaUpload"
      tags: ["Admin — Médias & Traitement IA"]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                storage_key:
                  type: string
                  description: "Clé renvoyée par la signature d'upload."
                role:
                  type: string
                  enum: [main, gallery, video_interior, video_exterior]
                mime:
                  type: string
                  nullable: true
                  description: "Facultatif : à défaut, l'API retient le type constaté chez l'hébergeur."
                bytes:
                  type: integer
                  nullable: true
                width:
                  type: integer
                  nullable: true
                height:
                  type: integer
                  nullable: true
                alt:
                  type: string
                  nullable: true
              required:
                - storage_key
                - role
      responses:
        '201':
          description: "Média confirmé"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AdminMedia"

  /admin/cars/{id}/media/reorder:
    post:
      summary: "Réordonnancement des médias de la galerie"
      operationId: "reorderCarMedia"
      tags: ["Admin — Médias & Traitement IA"]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                media_ids:
                  type: array
                  items:
                    type: integer
                  example: [14, 12, 13, 15]
              required:
                - media_ids
      responses:
        '200':
          description: "Positions mises à jour"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminMedia"

  /admin/media/{id}:
    patch:
      summary: "Mise à jour des métadonnées d'un média (alt, rôle)"
      operationId: "updateMedia"
      tags: ["Admin — Médias & Traitement IA"]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                alt:
                  type: string
                  nullable: true
                role:
                  type: string
                  enum: [main, gallery, video_interior, video_exterior]
      responses:
        '200':
          description: "Média mis à jour"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AdminMedia"
    delete:
      summary: "Suppression d'un média"
      operationId: "deleteMedia"
      tags: ["Admin — Médias & Traitement IA"]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: "Média supprimé"

  /admin/media/{id}/enhance:
    post:
      summary: "Demande d'amélioration IA d'une photo"
      description: "Exécute une transformation IA (amélioration automatique, recadrage intelligent ou détourage)."
      operationId: "enhanceMedia"
      tags: ["Admin — Médias & Traitement IA"]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum: [auto_improve, smart_crop, background_removal]
                params:
                  type: object
                  nullable: true
              required:
                - type
      responses:
        '201':
          description: "Dérivé généré (état ready)"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AdminMediaEnhancement"
        '409':
          description: "Quota mensuel épuisé (remove.bg)"

  /admin/media/{id}/enhancements:
    get:
      summary: "Liste des dérivés d'une photo"
      operationId: "getMediaEnhancements"
      tags: ["Admin — Médias & Traitement IA"]
      security:
        - bearerAuth: []
      parameters:
        - in: path
