          description: "Article créé"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AdminPost"

  /admin/posts/{id}:
    get:
      summary: "Fiche d'un article pour édition"
      operationId: "getAdminPost"
      tags: ["Admin — Blog"]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: "Article complet"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AdminPost"
    patch:
      summary: "Mise à jour ou publication d'un article"
      operationId: "updatePost"
      tags: ["Admin — Blog"]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                excerpt:
                  type: string
                body:
                  type: string
                service_id:
                  type: integer
                  nullable: true
                cover_media_id:
                  type: integer
                  nullable: true
                  description: "Média servant d'image de couverture. Doit exister."
                status:
                  type: string
                  enum: [draft, published]
      responses:
        '200':
          description: "Article mis à jour"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AdminPost"

  # ===========================================================================
  # 12. ADMIN — RÉGLAGES DU GARAGE
  # ===========================================================================
  /admin/settings:
    get:
      summary: "Liste complète des réglages"
      operationId: "getAdminSettings"
      tags: ["Admin — Réglages"]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: "Réglages du garage"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AdminSettings"
    patch:
      summary: "Modification en masse des réglages du garage"
      operationId: "updateAdminSettings"
      tags: ["Admin — Réglages"]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                settings:
                  type: object
                  example:
                    garage_name: "Garage Mékano Yaoundé"
                    whatsapp_number: "+237699000000"
