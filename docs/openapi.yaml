  # ===========================================================================
  # 11. ADMIN — BLOG TECHNIQUE
  # ===========================================================================
  /admin/posts:
    get:
      summary: "Liste des articles de blog pour le backoffice"
      operationId: "getAdminPosts"
      tags: ["Admin — Blog"]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: "Liste des articles"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminPost"
                  links:
                    $ref: "#/components/schemas/PaginationLinks"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
    post:
      summary: "Rédaction d'un nouvel article de blog"
      operationId: "createPost"
      tags: ["Admin — Blog"]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  example: "Comment entretenir sa boîte automatique en climat tropical"
                excerpt:
                  type: string
                body:
                  type: string
                  description: "Texte brut structuré (zéro HTML)"
                service_id:
                  type: integer
                  nullable: true
                cover_media_id:
                  type: integer
                  nullable: true
                  description: "Média servant d'image de couverture. Doit exister."
                status:
                  type: string
                  enum: [draft, published]
                  default: "draft"
