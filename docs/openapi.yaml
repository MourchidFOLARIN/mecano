              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AdminSettings"

# =============================================================================
# COMPOSANTS & SCHÉMAS DE DONNÉES
# =============================================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Mécanicien Chef"
        email:
          type: string
          format: email
          example: "mecanicien@garage.com"
        created_at:
          type: string
          format: date-time
      required:
        - id
        - name
        - email

    Brand:
      type: object
      properties:
        id:
          type: integer
          example: 1
        slug:
          type: string
          example: "toyota"
        name:
          type: string
          example: "Toyota"
        logo_url:
          type: string
          nullable: true
          example: "https://res.cloudinary.com/..."

    CarListItem:
      type: object
      properties:
        id:
          type: integer
          example: 1
        slug:
          type: string
          example: "toyota-rav4-2021-1"
        brand:
          $ref: "#/components/schemas/Brand"
        model:
          type: string
          example: "RAV4 Limited"
        year:
          type: integer
          example: 2021
        price_xaf:
          type: integer
          example: 14500000
        mileage_km:
          type: integer
          example: 48000
        fuel:
          type: object
          properties:
            value:
              type: string
              example: "essence"
            label:
              type: string
              example: "Essence"
        transmission:
          type: object
          properties:
            value:
              type: string
              example: "automatique"
            label:
              type: string
              example: "Automatique"
        condition:
          type: object
          properties:
            value:
              type: string
              example: "excellent"
            label:
              type: string
              example: "Excellent état"
        status:
          type: object
          properties:
            value:
              type: string
              example: "available"
            label:
              type: string
              example: "Disponible"
        main_photo:
          type: object
          nullable: true
          properties:
            url:
              type: string
              example: "https://res.cloudinary.com/..."
            width:
              type: integer
              example: 1920
            height:
              type: integer
              example: 1080

    CarDetail:
      allOf:
        - $ref: "#/components/schemas/CarListItem"
        - type: object
          properties:
            description:
              type: string
              example: "Véhicule en parfait état, révision complète effectuée..."
            photos:
              type: array
              items:
                type: object
            videos:
              type: array
              items:
                type: object

    AdminCarDetail:
      type: object
      description: |
        Annonce vue du backoffice. Distincte de `CarDetail` : elle porte les
        champs de pilotage (`is_publishable`, compteurs, `deleted_at`) et ne
        porte pas `whatsapp_url`, qui n'a de sens que sur la vitrine.
      properties:
        id:
          type: integer
          example: 3
        slug:
          type: string
          example: "toyota-rav4-2021-3"
        brand_id:
          type: integer
          example: 1
        brand:
          $ref: "#/components/schemas/AdminBrand"
        model:
          type: string
          example: "RAV4 Limited"
        year:
          type: integer
          example: 2021
        mileage_km:
          type: integer
          example: 48000
        price_xaf:
          type: integer
          example: 14500000
        fuel:
          $ref: "#/components/schemas/EnumValue"
        transmission:
          $ref: "#/components/schemas/EnumValue"
        color:
          type: string
          example: "Gris métallisé"
        condition:
          $ref: "#/components/schemas/EnumValue"
        description:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/EnumValue"
        is_featured:
          type: boolean
          example: false
        is_publishable:
          type: boolean
          description: "Faux tant que l'annonce n'a pas de photo principale : le passage en `available` sera refusé."
          example: true
        published_at:
          type: string
          format: date-time
          nullable: true
        sold_at:
          type: string
          format: date-time
          nullable: true
        views_count:
          type: integer
          example: 142
        whatsapp_clicks_count:
          type: integer
          example: 18
        main_photo:
          allOf:
            - $ref: "#/components/schemas/AdminMedia"
          nullable: true
        photos:
          type: array
          items:
            $ref: "#/components/schemas/AdminMedia"
        videos:
          type: array
          items:
            $ref: "#/components/schemas/AdminMedia"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: "Renseigné lorsque l'annonce est archivée."
      required:
        - id
        - slug
        - brand_id
        - model
        - year
        - mileage_km
        - price_xaf
        - fuel
        - transmission
        - color
        - condition
        - status
        - is_featured
        - is_publishable

    CreateCarRequest:
      type: object
      properties:
        brand_id:
          type: integer
          example: 1
        model:
          type: string
          example: "RAV4 Limited"
        year:
          type: integer
          example: 2021
        price_xaf:
          type: integer
          example: 14500000
        mileage_km:
          type: integer
          example: 48000
        fuel:
          type: string
          enum: [essence, diesel, hybride, electrique, gpl]
          example: "essence"
        transmission:
          type: string
          enum: [automatique, manuelle]
          example: "automatique"
        condition:
          type: string
          enum: [neuf, excellent, bon, moyen]
          example: "excellent"
        color:
          type: string
          example: "Gris métallisé"
        description:
          type: string
          example: "Climatisation d'origine, intérieur cuir..."
        is_featured:
          type: boolean
          description: "Met l'annonce en avant sur la vitrine."
          example: false
      required:
        - brand_id
        - model
        - year
        - price_xaf
        - mileage_km
        - fuel
        - transmission
        - condition
        - color

    UpdateCarRequest:
      type: object
      properties:
        brand_id:
          type: integer
        model:
          type: string
        year:
          type: integer
        price_xaf:
          type: integer
        mileage_km:
          type: integer
        fuel:
          type: string
          enum: [essence, diesel, hybride, electrique, gpl]
        transmission:
          type: string
          enum: [automatique, manuelle]
        condition:
          type: string
          enum: [neuf, excellent, bon, moyen]
        color:
          type: string
        description:
          type: string

    Service:
      type: object
      properties:
        id:
          type: integer
          example: 1
        slug:
          type: string
          example: "diagnostic-electronique"
        title:
          type: string
          example: "Diagnostic Électronique Complet"
        excerpt:
          type: string
          example: "Recherche de pannes avec valise constructeur"
        description:
          type: string
          example: "Analyse des calculateurs moteur, boîte, freinage ABS/ESP..."
        icon:
          type: string
          example: "cpu"
        price_from_xaf:
          type: integer
          example: 25000
        position:
          type: integer
          example: 1

    PostListItem:
      type: object
      properties:
        id:
          type: integer
          example: 1
        slug:
          type: string
          example: "5-signes-usure-plaquettes-frein"
        title:
          type: string
          example: "5 signes qui indiquent que vos plaquettes de frein sont usées"
        excerpt:
          type: string
          example: "Bruits suspects, pédale molle, distance de freinage allongée..."
        service:
          $ref: "#/components/schemas/Service"
        author:
          $ref: "#/components/schemas/User"
        published_at:
          type: string
          format: date-time

    PostDetail:
      allOf:
        - $ref: "#/components/schemas/PostListItem"
        - type: object
          properties:
            body:
              type: string
              description: "Texte brut structuré sans balises HTML"
            cover_media:
              type: object
              nullable: true

    DashboardMetrics:
      type: object
      properties:
        overview:
          type: object
          properties:
            total_cars:
              type: integer
              example: 15
            available_cars:
              type: integer
              example: 10
            reserved_cars:
              type: integer
              example: 2
            sold_cars:
              type: integer
              example: 3
            draft_cars:
              type: integer
              example: 0
        engagement:
          type: object
          properties:
            total_views:
              type: integer
              example: 1840
            total_whatsapp_clicks:
              type: integer
              example: 215
            conversion_rate_percentage:
              type: number
              example: 11.68
            average_days_to_sell:
              type: number
              example: 8.5
        workshop_and_content:
          type: object
          properties:
            total_services:
              type: integer
              example: 6
            active_services:
              type: integer
              example: 6
            total_posts:
              type: integer
              example: 5
            published_posts:
              type: integer
              example: 5
        quotas:
          type: object
          properties:
            removebg:
              type: object
              properties:
                period:
                  type: string
                  example: "2026-08"
                used:
                  type: integer
                  example: 12
                limit:
                  type: integer
                  example: 50
                available:
                  type: integer
                  example: 38

    PaginationMeta:
      type: object
      description: "Métadonnées de pagination, identiques sur tous les endpoints paginés."
      properties:
        current_page:
          type: integer
          example: 1
        last_page:
          type: integer
          example: 3
        per_page:
          type: integer
          example: 12
        total:
          type: integer
          example: 28
        from:
          type: integer
          nullable: true
          description: "Rang du premier élément de la page. `null` sur une page vide."
          example: 1
        to:
          type: integer
          nullable: true
          description: "Rang du dernier élément de la page. `null` sur une page vide."
          example: 12
        path:
          type: string
          example: "https://mecano-api.duckdns.org/api/v1/cars"
        links:
          type: array
          description: "Liens de pagination prêts à l'affichage."
          items:
            type: object
            properties:
              url:
                type: string
                nullable: true
              label:
                type: string
              page:
                type: integer
                nullable: true
              active:
                type: boolean
      required:
        - current_page
        - last_page
        - per_page
        - total

    ErrorDetail:
      type: object
      properties:
        code:
          type: string
          example: "VALIDATION_FAILED"
        message:
          type: string
          example: "Données de formulaire invalides."
        errors:
          type: object
          nullable: true


    # -------------------------------------------------------------------------
    # Ressources du backoffice
    #
    # Elles sont distinctes de leurs homologues publiques : une ressource admin
    # expose des champs internes (compteurs, is_publishable, deleted_at) qui ne
    # doivent jamais sortir sur un endpoint public.
    # -------------------------------------------------------------------------

    EnumValue:
      type: object
      description: "Énumération : le front affiche `label` et compare sur `value`."
      properties:
        value:
          type: string
          example: "diesel"
        label:
          type: string
          example: "Diesel"
      required:
        - value
        - label

    AdminBrand:
      type: object
      properties:
        id:
          type: integer
          example: 1
        slug:
          type: string
          example: "toyota"
        name:
          type: string
          example: "Toyota"
        logo_url:
          type: string
          nullable: true
          example: "https://res.cloudinary.com/demo/image/upload/marques/toyota.png"
        position:
          type: integer
          example: 1
        is_active:
          type: boolean
          example: true
        cars_count:
          type: integer
          description: "Présent uniquement lorsque le comptage est demandé."
          example: 4
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - slug
        - name
        - position
        - is_active

    AdminMedia:
      type: object
      description: "Média vu du backoffice : inclut la clé de stockage et l'original, jamais exposés publiquement."
      properties:
        id:
          type: integer
          example: 12
        car_id:
          type: integer
          example: 3
        kind:
          $ref: "#/components/schemas/EnumValue"
        role:
          $ref: "#/components/schemas/EnumValue"
        provider:
          $ref: "#/components/schemas/EnumValue"
        storage_key:
          type: string
          example: "mecano/cars/3/9f1c2e40-1a7b-4c11-9c33-2b7d0a5e77aa"
        url:
          type: string
          description: "URL de l'original. N'est jamais écrasée par une amélioration."
          example: "https://res.cloudinary.com/demo/image/upload/mecano/cars/3/9f1c.jpg"
        published_url:
          type: string
          nullable: true
          description: "Version servie au public. Ne change qu'à l'approbation d'un dérivé."
          example: "https://res.cloudinary.com/demo/image/upload/mecano/cars/3/9f1c.jpg"
        mime:
          type: string
          example: "image/jpeg"
        bytes:
          type: integer
          example: 2418123
        width:
          type: integer
          nullable: true
          example: 1600
        height:
          type: integer
          nullable: true
          example: 1200
        duration_s:
          type: integer
          nullable: true
          description: "Vidéos uniquement."
          example: 45
        position:
          type: integer
          example: 1
        alt:
          type: string
          nullable: true
          example: "Toyota RAV4 2021 — photo 1"
        confirmed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
      required:
        - id
        - car_id
        - kind
        - role
        - provider
        - storage_key
        - url
        - mime
        - bytes
        - position

    AdminService:
      type: object
      properties:
        id:
          type: integer
          example: 2
        slug:
          type: string
          example: "vidange-complete"
        title:
          type: string
          example: "Vidange complète"
        excerpt:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        icon:
          type: string
          nullable: true
          example: "wrench"
        price_from_xaf:
          type: integer
          nullable: true
          example: 25000
        is_active:
          type: boolean
          example: true
        position:
          type: integer
          example: 2
        posts_count:
          type: integer
          description: "Présent uniquement lorsque le comptage est demandé."
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - slug
        - title
        - is_active
        - position

    AdminPost:
      type: object
      properties:
        id:
          type: integer
          example: 5
        slug:
          type: string
          example: "quand-changer-ses-plaquettes"
        title:
          type: string
          example: "Quand changer ses plaquettes de frein"
        excerpt:
          type: string
          nullable: true
        body:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/EnumValue"
        service:
          type: object
          nullable: true
          description: "Forfait atelier rattaché, si l'article en cite un."
          properties:
            id:
              type: integer
            slug:
              type: string
            title:
              type: string
        author:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
        cover_media_id:
          type: integer
          nullable: true
        published_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - slug
        - title
        - status

    AdminMediaEnhancement:
      type: object
      properties:
        id:
          type: integer
          example: 7
        media_id:
          type: integer
          example: 12
        type:
          $ref: "#/components/schemas/EnumValue"
        provider:
          $ref: "#/components/schemas/EnumValue"
        status:
          $ref: "#/components/schemas/EnumValue"
        params:
          type: object
          nullable: true
          additionalProperties: true
          description: "Paramètres de la transformation appliquée."
        result_key:
          type: string
          nullable: true
        result_url:
          type: string
          nullable: true
          description: "Dérivé produit. Tant qu'il n'est pas approuvé, il n'est jamais servi au public."
        error:
          type: string
          nullable: true
          description: "Renseigné lorsque `status` vaut `failed`."
        cost_units:
          type: integer
          description: "Unités de quota consommées chez le fournisseur."
          example: 1
        approved_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - media_id
        - type
        - provider
        - status
        - cost_units

    AdminSettings:
      type: object
      description: |
        Réglages du garage, stockés en clé / valeur. Les clés listées ici sont
        celles qu'alimente le seeder ; le magasin en accepte d'autres.
      additionalProperties: true
      properties:
        garage_name:
          type: string
          example: "Garage Mecano Yaoundé"
        whatsapp_number:
          type: string
          example: "237690000000"
        hero_title:
          type: string
        hero_subtitle:
          type: string
        address:
          type: string
        opening_hours:
          type: object
          additionalProperties: true
        logo_url:
          type: string
          nullable: true

    IntegrationQuota:
      type: object
      description: "État du quota mensuel d'un fournisseur externe."
      properties:
        provider:
          type: string
          example: "removebg"
        period:
          type: string
          description: "Mois concerné, au format AAAA-MM."
          example: "2026-08"
        used:
          type: integer
          example: 12
        limit:
          type: integer
          example: 50
        available:
          type: integer
          example: 38
      required:
        - provider
        - period
        - used
        - limit
        - available

    SignedUpload:
      type: object
      description: |
        Paramètres d'un upload direct. Le fichier ne traverse jamais l'API : le
        backoffice l'envoie lui-même à l'hébergeur avec ces paramètres, puis
        confirme l'envoi.
      properties:
        upload_url:
          type: string
          description: "Point d'entrée de l'hébergeur."
          example: "https://api.cloudinary.com/v1_1/demo/image/upload"
        fields:
          type: object
          additionalProperties: true
          description: "Champs à joindre au formulaire d'envoi, tels quels."
        storage_key:
          type: string
          description: "Clé de l'objet chez l'hébergeur. À renvoyer à la confirmation."
          example: "mecano/cars/3/9f1c2e40-1a7b-4c11-9c33-2b7d0a5e77aa"
        expires_at:
          type: string
          format: date-time
          description: "Au-delà, la signature est refusée par l'hébergeur."
      required:
        - upload_url
        - fields
        - storage_key
        - expires_at

    PaginationLinks:
      type: object
      description: "URL de navigation renvoyées avec toute collection paginée."
      properties:
        first:
          type: string
          nullable: true
        last:
          type: string
          nullable: true
        prev:
          type: string
          nullable: true
        next:
          type: string
          nullable: true

  responses:
    Error401:
      description: "Non authentifié (token Sanctum manquant ou expiré)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
    Error404:
      description: "Ressource non trouvée"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
    Error422:
      description: "Erreur de validation des champs"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
